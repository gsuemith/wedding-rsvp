[build]
  command = "echo 'No build step required for Python functions'"
  functions = "netlify/functions"

[functions]
  included_files = ["src/**", "requirements.txt"]

# Redirect root to function
[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200

# Redirect /api (without trailing path) to function root
[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/"
  status = 200

# Redirect all API routes to the function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Catch-all redirect for all other routes to the FastAPI app
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

